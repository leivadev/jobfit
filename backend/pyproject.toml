[project]
name = "backend"
version = "0.1.0"
description = "JobFit backend: CV-to-job matching pipeline"
readme = "README.md"
authors = [
    { name = "leivadev" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.88",
    "datasets>=4.0.0",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "pandas>=2.2.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.0.1",
    "slowapi>=0.1.10",
    "structlog>=26.1.0",
    # Direct (not just transitive via sentence-transformers): tool.uv.sources
    # below only overrides the index for packages listed here.
    "torch>=2.2",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that hit real external services",
]

[tool.uv.sources]
# CPU-only wheels: backend is CPU-only (faiss-cpu, no GPU), and PyPI's default
# linux torch wheel drags in the full CUDA toolkit (~2GB of nvidia-* deps).
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.poe.tasks]
dev = "uvicorn backend.api.app:app --reload --env-file .env"
lint = "ruff check ."
test = "pytest -m \"not integration\""
