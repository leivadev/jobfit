[project]
name = "backend"
version = "0.1.0"
description = "JobFit backend: CV-to-job matching pipeline"
readme = "README.md"
authors = [
    { name = "leivadev" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.88",
    "datasets>=4.0.0",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "pandas>=2.2.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.1",
    "slowapi>=0.1.10",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that hit real external services",
]
