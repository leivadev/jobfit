name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "infra/containerapp-probes.yaml"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  packages: write

concurrency:
  group: backend-deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/leivadev/jobfit-backend:${{ github.sha }}
            ghcr.io/leivadev/jobfit-backend:latest
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy image
        run: |
          az containerapp update \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image ghcr.io/leivadev/jobfit-backend:${{ github.sha }}

      - name: Configure health probes
        run: |
          az containerapp show \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            -o yaml > /tmp/containerapp.yaml
          yq eval '
            (.properties.template.containers[] | select(.name == "jobfit-backend") | .probes)
              = load("infra/containerapp-probes.yaml").properties.template.containers[0].probes
          ' -i /tmp/containerapp.yaml
          az containerapp update \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --yaml /tmp/containerapp.yaml
